plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.pandapools'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.pandapools"
        minSdk 28
        targetSdk 35
        versionCode 946
        versionName "0.9.46"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Dedicated PandaPools release key. Credentials are read from ~/.gradle/gradle.properties
        // (outside any repo) so the keystore path and passwords are NEVER committed. On a machine
        // without those props this config stays empty and release falls back to debug signing,
        // so the project still builds for local/CI sideload use.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the dedicated FAMILY RELEASE KEY via signingConfigs.release whenever the
            // MINIMA_FAMILY_RELEASE_* gradle props are present (they are on the release machine); without
            // them it falls back to debug signing for local/CI sideload builds only. The published catalog
            // is therefore family-key-signed — verified: 0.9.30 and 0.9.34 both carry signer cert SHA-256
            // eca1383c9d27683a281fbe6355356267877dc2dd14d963d7cc289ca0700e517f (NOT debug-signed). Do NOT
            // switch keys: a cert change forces every existing user to uninstall+reinstall and re-pair
            // their MINIMA_ID with the node. Always publish from a machine that has the family-key props.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed wallet UI
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // QR code generation for the Receive screen
    implementation 'com.google.zxing:core:3.5.3'

    // SVG token icons (Android's BitmapFactory can't rasterise SVG; many Minima tokens use SVG urls)
    implementation 'com.caverock:androidsvg-aar:1.4'

    // Doze-safe periodic background work (Layer-5 beacon re-announce while the owner is away)
    implementation 'androidx.work:work-runtime:2.9.1'

    implementation files('libs/minimaapi.aar')
    // PocketWeb's provider-independent SHA3 implementation works on Samsung Android.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'

    // Local JVM unit tests (pure-logic + fund-critical facets: covenant/address, curve/token-grain, router, parsing)
    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the unit-test classpath (android.jar ships stubs that throw "not mocked")
    testImplementation 'org.json:json:20231013'
}
